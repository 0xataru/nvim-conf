# main configurations
background_opacity 1
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          14
scrollback_lines   5000
# adjust_line_height 0.9
cursor_shape       beam
bold_font          auto
italic_font        auto
bold_italic_font   auto

# color scheme
background               #1d1f21
foreground               #c5c8c6
cursor_color             #c5c8c6
selection_background     #373b41
selection_foreground     #c5c8c6
active_tab_background    #f0c674
active_tab_foreground    #1d1f21
inactive_tab_background  #282a2e
inactive_tab_foreground  #c5c8c6

# colors ANSI
color0   #1d1f21
color1   #cc6666
color2   #b5bd68
color3   #f0c674
color4   #81a2be
color5   #b294bb
color6   #8abeb7
color7   #c5c8c6
color8   #969896
color9   #cc6666
color10  #b5bd68
color11  #f0c674
color12  #81a2be
color13  #b294bb
color14  #8abeb7
color15  #ffffff

# window layout (required for vsplit/hsplit)
enabled_layouts  splits

# vim-style navigation between tabs
map cmd+t new_tab_with_cwd 
map cmd+w close_tab  
map cmd+l next_tab  
map cmd+h previous_tab

 # resize the active split
map ctrl+shift+left  resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up    resize_window taller
map ctrl+shift+down  resize_window shorter
map ctrl+shift+home  resize_window reset

# vim-style navigation between splits
map ctrl+shift+s launch --location=vsplit --cwd=current
map ctrl+shift+q close_window
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# maximize / minimize font
map ctrl+shift+plus increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+0 reset_font_size

# additional settings for rendering
# good for screens with high quality
enable_ligatures      true
bold_text_brightness  1.1
force_ligatures       always
